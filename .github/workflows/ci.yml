name: CI

on:
  push:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      isolated:
        description: 1 process per test (slower, isolates each test)
        type: boolean
        default: false

permissions:
  contents: read

# new run cancels stale run (same branch)
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'schedule' || inputs.isolated == true }}
  cancel-in-progress: true

# Clang + GNU ABI, fetched toolchain

env:
  EACH: ${{ (github.event_name == 'schedule' || inputs.isolated) && '--each' || '' }}
  # need a GPU (pixel exact, pipeline per node)
  WINDOWS_GPU_ONLY: >-
    SkyPrefilterFixture.SmoothSkyMatchesOracle
    TextureSamplingFixture.PointSamplesOneTexelAtGrazingAngle
    UIRenderFixture.TabLikeCompositeIsPixelSymmetric
    UIRenderFixture.AuthoredTranslucentTokensCompositeWayCssDoes
    AmbientOcclusionRenderFixture.AfterOpaqueSurvivesPostRow
    BC6HSampleFixture.CodecDecodeMatchesGpu
    SwapChainResizeCostTest.RebuildInvalidatesHandles
    NodeShaderGPUFixture.EveryNodeMatchesReferenceOnGPU
  LINUX_GPU_ONLY: >-
    SkyPrefilterFixture.SmoothSkyMatchesOracle
    TextureSamplingFixture.PointSamplesOneTexelAtGrazingAngle
    TextureSamplingFixture.LevelAndProfileShapeGrazingFootprint
    UIRenderFixture.TabLikeCompositeIsPixelSymmetric
    UIRenderFixture.AuthoredTranslucentTokensCompositeWayCssDoes
    AmbientOcclusionRenderFixture.AfterOpaqueSurvivesPostRow
    NodeShaderGPUFixture.EveryNodeMatchesReferenceOnGPU
  # skipped device tier/player builds should fail the lane
  DEVICE_SKIPS: "no (Vulkan )?(device|ICD)"

jobs:
  checks:
    name: checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # cached by pin content
      - name: Restore downloads
        id: downloads
        uses: actions/cache/restore@v6
        with:
          path: ~/prebuilt-archives
          key: prebuilt-windows-${{ hashFiles('Scripts/fetch_prebuilt.py', 'Scripts/linux_pack.py', 'Source/CSharp/DotNetPin.json') }}

      - name: Fetch prebuilt binaries
        run: python Scripts/fetch_prebuilt.py --lavapipe --toolchain --dotnet --archives "$HOME/prebuilt-archives"

      - name: Keep downloads
        if: steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/prebuilt-archives
          key: prebuilt-windows-${{ hashFiles('Scripts/fetch_prebuilt.py', 'Scripts/linux_pack.py', 'Source/CSharp/DotNetPin.json') }}

      # pinned version (the runner's realigns comments)
      - name: Check formatting
        shell: pwsh
        run: |
          $files = @(git ls-files 'Source/*.h' 'Source/*.hpp' 'Source/*.inl' 'Source/*.cpp' 'Samples/*.h' 'Samples/*.cpp' |
            Where-Object { $_ -notmatch '/ThirdParty/|\.generated\.|/stb_image\.h$' })
          $failed = 0
          # batched (32767 char command line limit on Windows)
          for ($i = 0; $i -lt $files.Count; $i += 200) {
            External/Prebuilt/llvm-mingw/bin/clang-format.exe --dry-run -Werror $files[$i..([Math]::Min($i + 199, $files.Count - 1))]
            if ($LASTEXITCODE -ne 0) { $failed = 1 }
          }
          exit $failed

      # fail the build when stale
      - name: Third-party notices are current
        run: python Scripts/generate_notices.py --check

      - name: C# bindings are current
        run: python Scripts/generate_csharp_bindings.py --check

      - name: Script tests
        working-directory: Scripts
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem -Filter *_test.py)
          if ($tests.Count -eq 0) { throw "no script tests found" }
          $failed = 0
          foreach ($test in $tests) {
            echo "==== $($test.Name) ===="
            python $test.Name
            if ($LASTEXITCODE -ne 0) { $failed = 1 }
          }
          exit $failed

  checks-linux:
    name: checks (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Lint the workflow
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      # staging rules describe Windows SDK
      - name: Script tests
        working-directory: Scripts
        run: |
          failed=0
          count=0
          for test in *_test.py; do
            [ "$test" = staging_test.py ] && continue
            echo "==== $test ===="
            python3 "$test" || failed=1
            count=$((count + 1))
          done
          [ "$count" -gt 0 ] || { echo "no script tests found"; exit 1; }
          exit $failed

  windows:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    # hung test would hold the runner for 10000 years
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.isolated) && 330 || 150 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # the "everyday dev" configuration
          - name: shared-debug
            preset: debug
            tree: build
            siblings: static-debug
            sibling_skips: "|no sibling static"
            downloads: windows
            fetch: ""
            benchmarks: false
          # static half of dual mode
          - name: static-debug
            preset: static-debug
            tree: build-static
            siblings: ""
            sibling_skips: ""
            downloads: windows
            fetch: ""
            benchmarks: false
          # optimized lane, also runs "micro benchmarks"
          - name: shared-release
            preset: release
            tree: build-release
            siblings: static-release linux-static-release
            sibling_skips: "|no sibling static|no static SDK built for Linux"
            downloads: windows-linux
            fetch: --linux
            benchmarks: true
          - name: static-release
            preset: static-release
            tree: build-static-release
            siblings: ""
            sibling_skips: ""
            downloads: windows
            fetch: ""
            benchmarks: false

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # cached by pin content
      - name: Restore downloads
        id: downloads
        uses: actions/cache/restore@v6
        with:
          path: ~/prebuilt-archives
          key: prebuilt-${{ matrix.downloads }}-${{ hashFiles('Scripts/fetch_prebuilt.py', 'Scripts/linux_pack.py', 'Source/CSharp/DotNetPin.json') }}

      - name: Restore NuGet packages
        id: nuget
        uses: actions/cache/restore@v6
        with:
          path: External/Prebuilt/nuget
          key: nuget-windows-${{ hashFiles('Source/CSharp/Managed/**/packages.lock.json', 'Source/CSharp/DotNetPin.json') }}

      - name: Fetch prebuilt binaries
        run: python Scripts/fetch_prebuilt.py --lavapipe --toolchain --dotnet-packs ${{ matrix.fetch }} --archives "$HOME/prebuilt-archives"

      - name: Keep downloads
        if: steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/prebuilt-archives
          key: prebuilt-${{ matrix.downloads }}-${{ hashFiles('Scripts/fetch_prebuilt.py', 'Scripts/linux_pack.py', 'Source/CSharp/DotNetPin.json') }}

      # fetched binaru goes first because runner's clang++ targets MSVC
      - name: Put the toolchain on PATH
        shell: pwsh
        run: |
          echo "$(Resolve-Path External/Prebuilt/llvm-mingw/bin)" >> $env:GITHUB_PATH
          echo "$(Resolve-Path External/Prebuilt/cmake/bin)" >> $env:GITHUB_PATH
          echo "$(Resolve-Path External/Prebuilt/ninja)" >> $env:GITHUB_PATH

      # VK_DRIVER_FILES ignored by damn loader when elevated (registry only)
      - name: Register software Vulkan driver
        shell: pwsh
        run: |
          $icd = Get-ChildItem -Recurse External/Prebuilt/lavapipe -Filter lvp_icd.x86_64.json | Select-Object -First 1
          if (-not $icd) { throw "lavapipe ICD manifest not found" }
          reg add 'HKLM\SOFTWARE\Khronos\Vulkan\Drivers' /v $icd.FullName /t REG_DWORD /d 0 /f /reg:64
          if ($LASTEXITCODE -ne 0) { throw "couldn't register $($icd.FullName)" }
          echo "VK_DRIVER_FILES=$($icd.FullName)" >> $env:GITHUB_ENV
          echo "VK_LOADER_LAYERS_DISABLE=~all~" >> $env:GITHUB_ENV

      # shared editor builds players from these
      - name: Build sibling trees
        if: matrix.siblings != ''
        shell: pwsh
        run: |
          foreach ($preset in "${{ matrix.siblings }}".Split(' ')) {
            echo "==== $preset ===="
            cmake --preset $preset -DSHALLTEAR_WARNINGS_AS_ERRORS=ON -DSHALLTEAR_BUILD_TESTS=OFF -DSHALLTEAR_BUILD_BENCHMARKS=OFF
            if ($LASTEXITCODE -ne 0) { exit 1 }
            cmake --build --preset $preset
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      # warnings = errors only here (fresh clones should build)
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DSHALLTEAR_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Keep NuGet packages
        if: steps.nuget.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: External/Prebuilt/nuget
          key: nuget-windows-${{ hashFiles('Source/CSharp/Managed/**/packages.lock.json', 'Source/CSharp/DotNetPin.json') }}

      - name: Test
        run: python Scripts/run_suite.py ${{ matrix.tree }} --exclude "${{ env.WINDOWS_GPU_ONLY }}" --fail-skips "^(${{ env.DEVICE_SKIPS }}${{ matrix.sibling_skips }})" ${{ env.EACH }}

      - name: Benchmarks (informational)
        if: matrix.benchmarks
        run: ${{ matrix.tree }}/bin/ShalltearBenchmarks.exe

      - name: Keep the test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-tests
          path: ${{ matrix.tree }}/Testing/suite.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Disk space
        if: always()
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free

  linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.isolated) && 330 || 150 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-shared-debug
            preset: linux-debug
            tree: build-linux
            siblings: linux-static-debug
            sibling_skips: "|no sibling static"
          - name: linux-static-debug
            preset: linux-static-debug
            tree: build-linux-static
            siblings: ""
            sibling_skips: ""
          - name: linux-shared-release
            preset: linux-release
            tree: build-linux-release
            siblings: linux-static-release
            sibling_skips: "|no sibling static"
          - name: linux-static-release
            preset: linux-static-release
            tree: build-linux-static-release
            siblings: ""
            sibling_skips: ""

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install the display server and software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb openbox mesa-vulkan-drivers libvulkan1 \
            libx11-6 libxi6 libxrandr2 libxcursor1 libxkbcommon0 libasound2t64 libpulse0 libfontconfig1 libcurl4t64

      # cached by pin content
      - name: Restore downloads
        id: downloads
        uses: actions/cache/restore@v6
        with:
          path: ~/prebuilt-archives
          key: prebuilt-linux-${{ hashFiles('Scripts/fetch_prebuilt.py', 'Scripts/linux_pack.py', 'Source/CSharp/DotNetPin.json') }}

      - name: Restore NuGet packages
        id: nuget
        uses: actions/cache/restore@v6
        with:
          path: External/Prebuilt/nuget
          key: nuget-linux-${{ hashFiles('Source/CSharp/Managed/**/packages.lock.json', 'Source/CSharp/DotNetPin.json') }}

      - name: Fetch prebuilt binaries
        run: python3 Scripts/fetch_prebuilt.py --toolchain --dotnet-packs --archives "$HOME/prebuilt-archives"

      - name: Keep downloads
        if: steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/prebuilt-archives
          key: prebuilt-linux-${{ hashFiles('Scripts/fetch_prebuilt.py', 'Scripts/linux_pack.py', 'Source/CSharp/DotNetPin.json') }}

      - name: Put the toolchain on PATH
        run: |
          {
            echo "$PWD/External/Prebuilt/llvm-mingw/bin"
            echo "$PWD/External/Prebuilt/cmake/bin"
            echo "$PWD/External/Prebuilt/ninja"
          } >> "$GITHUB_PATH"

      - name: Start the display server
        run: |
          setsid nohup Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          sleep 2
          DISPLAY=:99 setsid nohup openbox > "$RUNNER_TEMP/openbox.log" 2>&1 &
          sleep 2
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json" >> "$GITHUB_ENV"

      # shared editor builds players from these
      - name: Build sibling trees
        if: matrix.siblings != ''
        run: |
          for preset in ${{ matrix.siblings }}; do
            echo "==== $preset ===="
            cmake --preset "$preset" -DSHALLTEAR_WARNINGS_AS_ERRORS=ON -DSHALLTEAR_BUILD_TESTS=OFF -DSHALLTEAR_BUILD_BENCHMARKS=OFF
            cmake --build --preset "$preset"
          done

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DSHALLTEAR_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Keep NuGet packages
        if: steps.nuget.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: External/Prebuilt/nuget
          key: nuget-linux-${{ hashFiles('Source/CSharp/Managed/**/packages.lock.json', 'Source/CSharp/DotNetPin.json') }}

      - name: Test
        run: python3 Scripts/run_suite.py ${{ matrix.tree }} --exclude "${{ env.LINUX_GPU_ONLY }}" --fail-skips "^(${{ env.DEVICE_SKIPS }}${{ matrix.sibling_skips }})" ${{ env.EACH }}

      - name: Keep the test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-tests
          path: ${{ matrix.tree }}/Testing/suite.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Disk space
        if: always()
        run: df -h / "$GITHUB_WORKSPACE"

  headers:
    # isolated header compiles?
    name: shared-debug-nopch
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # cached by pin content
      - name: Restore downloads
        uses: actions/cache/restore@v6
        with:
          path: ~/prebuilt-archives
          key: prebuilt-windows-${{ hashFiles('Scripts/fetch_prebuilt.py', 'Scripts/linux_pack.py', 'Source/CSharp/DotNetPin.json') }}

      - name: Fetch prebuilt binaries
        run: python Scripts/fetch_prebuilt.py --lavapipe --toolchain --dotnet --archives "$HOME/prebuilt-archives"

      - name: Restore NuGet packages
        uses: actions/cache/restore@v6
        with:
          path: External/Prebuilt/nuget
          key: nuget-windows-${{ hashFiles('Source/CSharp/Managed/**/packages.lock.json', 'Source/CSharp/DotNetPin.json') }}

      - name: Put the toolchain on PATH
        shell: pwsh
        run: |
          echo "$(Resolve-Path External/Prebuilt/llvm-mingw/bin)" >> $env:GITHUB_PATH
          echo "$(Resolve-Path External/Prebuilt/cmake/bin)" >> $env:GITHUB_PATH
          echo "$(Resolve-Path External/Prebuilt/ninja)" >> $env:GITHUB_PATH

      - name: Configure
        run: cmake --preset debug -DSHALLTEAR_DISABLE_PCH=ON -DSHALLTEAR_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset debug

      - name: Header hygiene (isolated public headers)
        run: cmake --build --preset debug --target ShalltearHeaderCheck ShalltearStrippedHeaderCheck

  fresh-clone:
    name: fresh clone (Build.bat)
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      SHALLTEAR_NO_PAUSE: 1
    steps:
      - uses: actions/checkout@v7

      - name: Build + test
        shell: cmd
        run: call Build.bat tests
